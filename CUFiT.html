.big{font-size:34px;font-weight:700;color:var(--pink)}.cnt{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0}.cnt b{font-size:22px;min-width:30px;text-align:center}

nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(412px,calc(100% - 24px));background:var(--pink);border-radius:99px;padding:6px;display:flex;gap:2px;box-shadow:0 6px 20px #e2587f55}
nav button{flex:1;border:0;background:none;color:#fff;font:inherit;font-size:11px;padding:7px 2px;border-radius:99px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}nav button.on{background:#fff;color:var(--pink);font-weight:600}

.login{min-height:90vh;display:flex;flex-direction:column;justify-content:center}.login .lg{font-size:46px;font-weight:700;color:var(--pink);text-align:center;letter-spacing:1px}
.note{font-size:11px;color:var(--mute);text-align:center;margin-top:6px}
